[project]
name = "agentflow-backend"
version = "0.1.0"
description = "AgentFlow Multi-Agent Suite - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.17",
    "playwright>=1.48.0",
    "browser-use>=0.3.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.2.0",
    "rich>=13.9.4",
    "loguru>=0.7.2",
    "orjson>=3.10.11",
    "ujson>=5.10.0",
    "aiofiles>=24.1.0",
    "itsdangerous>=2.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
